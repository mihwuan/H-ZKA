[package]
name = "hzka-arkworks-harness"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
ark-bn254 = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-groth16 = "0.4"
rayon = { version = "1.10", optional = true }

[features]
default = []
parallel = [
  "dep:rayon",
  "ark-ec/parallel",
  "ark-ff/parallel",
  "ark-groth16/parallel"
]
